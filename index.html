<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoofingOS Pro - Residential Roofing Estimator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // API Configuration
        const API_URL = 'http://localhost:8000/api';
        const api = axios.create({ baseURL: API_URL });

        // Sample Data
        const SAMPLE_PROJECTS = [
            {
                id: 1,
                customer: "John Smith",
                address: "123 Main St, Springfield, IL",
                roofArea: 2500,
                material: "Architectural Shingles",
                pitch: "6/12",
                cost: 12500,
                status: "quoted",
                created: "2026-03-15",
                phone: "(555) 123-4567",
                email: "john.smith@email.com"
            },
            {
                id: 2,
                customer: "Sarah Johnson",
                address: "456 Oak Ave, Springfield, IL",
                roofArea: 3200,
                material: "Metal Roofing",
                pitch: "8/12",
                cost: 28800,
                status: "in_progress",
                created: "2026-03-10",
                phone: "(555) 234-5678",
                email: "sarah.j@email.com"
            },
            {
                id: 3,
                customer: "Mike Davis",
                address: "789 Pine Rd, Springfield, IL",
                roofArea: 1800,
                material: "3-Tab Shingles",
                pitch: "4/12",
                cost: 7200,
                status: "completed",
                created: "2026-03-05",
                phone: "(555) 345-6789",
                email: "mdavis@email.com"
            },
            {
                id: 4,
                customer: "Emily Brown",
                address: "321 Elm St, Springfield, IL",
                roofArea: 2800,
                material: "Clay Tile",
                pitch: "5/12",
                cost: 33600,
                status: "quoted",
                created: "2026-03-12",
                phone: "(555) 456-7890",
                email: "emily.brown@email.com"
            }
        ];

        const SAMPLE_CUSTOMERS = [
            {
                id: 1,
                name: "John Smith",
                email: "john.smith@email.com",
                phone: "(555) 123-4567",
                address: "123 Main St, Springfield, IL",
                quotes: 2,
                projects: 1,
                totalValue: "$24,500",
                lastContact: "2 days ago"
            },
            {
                id: 2,
                name: "Sarah Johnson",
                email: "sarah.j@email.com",
                phone: "(555) 234-5678",
                address: "456 Oak Ave, Springfield, IL",
                quotes: 1,
                projects: 1,
                totalValue: "$28,800",
                lastContact: "1 week ago"
            },
            {
                id: 3,
                name: "Mike Davis",
                email: "mdavis@email.com",
                phone: "(555) 345-6789",
                address: "789 Pine Rd, Springfield, IL",
                quotes: 3,
                projects: 2,
                totalValue: "$15,600",
                lastContact: "3 weeks ago"
            }
        ];

        // Main App Component
        function App() {
            const [user, setUser] = useState(null);
            const [currentView, setCurrentView] = useState('dashboard');
            const [projects, setProjects] = useState(SAMPLE_PROJECTS);
            const [customers, setCustomers] = useState(SAMPLE_CUSTOMERS);
            const [selectedProject, setSelectedProject] = useState(null);

            useEffect(() => {
                const storedUser = localStorage.getItem('user_roofing');
                if (storedUser) setUser(JSON.parse(storedUser));
            }, []);

            const handleLogin = (userData, token) => {
                setUser(userData);
                localStorage.setItem('user_roofing', JSON.stringify(userData));
                localStorage.setItem('token_roofing', token);
            };

            const handleLogout = () => {
                setUser(null);
                localStorage.removeItem('user_roofing');
                localStorage.removeItem('token_roofing');
            };

            if (!user) {
                return <LoginScreen onLogin={handleLogin} />;
            }

            return (
                <div className="min-h-screen bg-gray-50">
                    <nav className="bg-orange-900 text-white shadow-lg">
                        <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className="flex items-center gap-2">
                                    <span className="text-2xl">🏠</span>
                                    <h1 className="text-xl font-bold">RoofingOS Pro</h1>
                                </div>
                            </div>
                            <div className="flex items-center gap-4">
                                <div className="text-right text-sm">
                                    <div className="text-orange-300">Residential Estimator</div>
                                    <div className="text-gray-400">Status: <span className="text-green-400">● Online</span></div>
                                </div>
                                <span className="text-sm opacity-75">👤 {user.name}</span>
                                <button
                                    onClick={handleLogout}
                                    className="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm font-semibold transition-colors"
                                >
                                    Logout
                                </button>
                            </div>
                        </div>
                    </nav>

                    <div className="flex">
                        <aside className="w-64 bg-white shadow-lg min-h-screen">
                            <nav className="p-4">
                                <MenuItem
                                    icon="📊"
                                    label="Dashboard"
                                    active={currentView === 'dashboard'}
                                    onClick={() => setCurrentView('dashboard')}
                                />
                                <MenuItem
                                    icon="🧮"
                                    label="Calculator"
                                    active={currentView === 'calculator'}
                                    onClick={() => setCurrentView('calculator')}
                                />
                                <MenuItem
                                    icon="📋"
                                    label="Projects"
                                    active={currentView === 'projects'}
                                    onClick={() => setCurrentView('projects')}
                                    badge={projects.filter(p => p.status !== 'completed').length}
                                />
                                <MenuItem
                                    icon="👥"
                                    label="Customers"
                                    active={currentView === 'customers'}
                                    onClick={() => setCurrentView('customers')}
                                    badge={customers.length}
                                />
                                <MenuItem
                                    icon="📈"
                                    label="Reports"
                                    active={currentView === 'reports'}
                                    onClick={() => setCurrentView('reports')}
                                />
                                <MenuItem
                                    icon="⚙️"
                                    label="Settings"
                                    active={currentView === 'settings'}
                                    onClick={() => setCurrentView('settings')}
                                />
                            </nav>
                        </aside>

                        <main className="flex-1 p-8">
                            {currentView === 'dashboard' && <Dashboard projects={projects} customers={customers} onViewProject={(p) => {setSelectedProject(p); setCurrentView('projects');}} />}
                            {currentView === 'calculator' && <Calculator onCreateProject={(project) => {setProjects([...projects, {...project, id: projects.length + 1}]); setCurrentView('projects');}} />}
                            {currentView === 'projects' && <Projects projects={projects} selectedProject={selectedProject} onSelectProject={setSelectedProject} />}
                            {currentView === 'customers' && <Customers customers={customers} />}
                            {currentView === 'reports' && <Reports projects={projects} />}
                            {currentView === 'settings' && <Settings />}
                        </main>
                    </div>

                    {selectedProject && (
                        <ProjectModal 
                            project={selectedProject} 
                            onClose={() => setSelectedProject(null)}
                        />
                    )}
                </div>
            );
        }

        // Login Screen
        function LoginScreen({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                const userData = { name: username || 'Demo Roofer', role: 'Contractor' };
                const token = 'demo-token-' + Date.now();
                onLogin(userData, token);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-orange-900 to-orange-700 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
                        <div className="text-center mb-8">
                            <span className="text-6xl">🏠</span>
                            <h1 className="text-3xl font-bold text-gray-900 mt-4">RoofingOS Pro</h1>
                            <p className="text-gray-600 mt-2">Residential Roofing Estimator</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                                <input
                                    type="text"
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500"
                                    placeholder="Enter username"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500"
                                    placeholder="Enter password"
                                />
                            </div>
                            <button
                                type="submit"
                                className="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-4 rounded-lg transition-colors"
                            >
                                Login to RoofingOS
                            </button>
                        </form>
                        <p className="text-center text-sm text-gray-500 mt-6">
                            Demo Mode - Enter any credentials
                        </p>
                    </div>
                </div>
            );
        }

        // Menu Item Component
        function MenuItem({ icon, label, active, onClick, badge }) {
            return (
                <button
                    onClick={onClick}
                    className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors mb-2 ${
                        active ? 'bg-orange-600 text-white' : 'text-gray-700 hover:bg-gray-100'
                    }`}
                >
                    <span className="text-xl">{icon}</span>
                    <span className="font-medium flex-1 text-left">{label}</span>
                    {badge && (
                        <span className={`px-2 py-1 rounded-full text-xs font-semibold ${
                            active ? 'bg-white text-orange-600' : 'bg-orange-100 text-orange-600'
                        }`}>
                            {badge}
                        </span>
                    )}
                </button>
            );
        }

        // Dashboard View
        function Dashboard({ projects, customers, onViewProject }) {
            const stats = {
                totalProjects: projects.length,
                active: projects.filter(p => p.status !== 'completed').length,
                quoted: projects.filter(p => p.status === 'quoted').length,
                revenue: projects.reduce((sum, p) => sum + p.cost, 0)
            };

            return (
                <div>
                    <h1 className="text-3xl font-bold text-gray-900 mb-8">Dashboard</h1>
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        <StatCard title="Total Projects" value={stats.totalProjects} subtitle="All time" color="blue" />
                        <StatCard title="Active Projects" value={stats.active} subtitle="In progress" color="orange" />
                        <StatCard title="Pending Quotes" value={stats.quoted} subtitle="Awaiting approval" color="yellow" />
                        <StatCard title="Total Revenue" value={`$${(stats.revenue/1000).toFixed(1)}K`} subtitle="This month" color="green" />
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
                        <div className="bg-white rounded-xl shadow-lg p-6">
                            <h2 className="text-xl font-bold text-gray-900 mb-6">Recent Projects</h2>
                            <div className="space-y-4">
                                {projects.slice(0, 4).map(project => (
                                    <div 
                                        key={project.id}
                                        onClick={() => onViewProject(project)}
                                        className="p-4 bg-gray-50 rounded-lg hover:bg-gray-100 cursor-pointer transition"
                                    >
                                        <div className="flex items-center justify-between mb-2">
                                            <p className="font-semibold text-gray-900">{project.customer}</p>
                                            <StatusBadge status={project.status} />
                                        </div>
                                        <p className="text-sm text-gray-600">{project.address}</p>
                                        <div className="flex items-center justify-between mt-2">
                                            <span className="text-sm text-gray-500">{project.roofArea} sq ft</span>
                                            <span className="text-sm font-semibold text-orange-600">${project.cost.toLocaleString()}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6">
                            <h2 className="text-xl font-bold text-gray-900 mb-6">Top Customers</h2>
                            <div className="space-y-4">
                                {customers.slice(0, 4).map(customer => (
                                    <div key={customer.id} className="p-4 bg-gray-50 rounded-lg">
                                        <div className="flex items-center justify-between mb-2">
                                            <p className="font-semibold text-gray-900">{customer.name}</p>
                                            <span className="text-sm font-semibold text-green-600">{customer.totalValue}</span>
                                        </div>
                                        <p className="text-sm text-gray-600">{customer.email}</p>
                                        <div className="flex items-center justify-between mt-2">
                                            <span className="text-xs text-gray-500">{customer.projects} projects</span>
                                            <span className="text-xs text-gray-500">Last: {customer.lastContact}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Calculator View
        function Calculator({ onCreateProject }) {
            const [formData, setFormData] = useState({
                customer: '',
                address: '',
                roofArea: '',
                material: 'Architectural Shingles',
                pitch: '4/12',
                layers: '1'
            });

            const materialPrices = {
                '3-Tab Shingles': 4.00,
                'Architectural Shingles': 5.00,
                'Designer Shingles': 6.50,
                'Metal Roofing': 9.00,
                'Clay Tile': 12.00,
                'Slate': 15.00
            };

            const calculateCost = () => {
                const area = parseInt(formData.roofArea) || 0;
                const basePrice = materialPrices[formData.material];
                const layerMultiplier = formData.layers === '2' ? 1.3 : 1.0;
                const pitchMultiplier = formData.pitch.startsWith('8') || formData.pitch.startsWith('9') ? 1.2 : 1.0;
                return Math.round(area * basePrice * layerMultiplier * pitchMultiplier);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const cost = calculateCost();
                const project = {
                    ...formData,
                    cost,
                    status: 'quoted',
                    created: new Date().toISOString().split('T')[0],
                    phone: '(555) 000-0000',
                    email: 'customer@email.com'
                };
                onCreateProject(project);
                alert('Quote created successfully!');
            };

            return (
                <div>
                    <h1 className="text-3xl font-bold text-gray-900 mb-8">Roof Calculator</h1>
                    
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2">
                            <div className="bg-white rounded-xl shadow-lg p-6">
                                <form onSubmit={handleSubmit} className="space-y-6">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Customer Name</label>
                                            <input
                                                type="text"
                                                value={formData.customer}
                                                onChange={(e) => setFormData({...formData, customer: e.target.value})}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500"
                                                required
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Roof Area (sq ft)</label>
                                            <input
                                                type="number"
                                                value={formData.roofArea}
                                                onChange={(e) => setFormData({...formData, roofArea: e.target.value})}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500"
                                                required
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">Address</label>
                                        <input
                                            type="text"
                                            value={formData.address}
                                            onChange={(e) => setFormData({...formData, address: e.target.value})}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500"
                                            required
                                        />
                                    </div>

                                    <div className="grid grid-cols-3 gap-4">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Material</label>
                                            <select
                                                value={formData.material}
                                                onChange={(e) => setFormData({...formData, material: e.target.value})}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500"
                                            >
                                                {Object.keys(materialPrices).map(material => (
                                                    <option key={material} value={material}>{material}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Roof Pitch</label>
                                            <select
                                                value={formData.pitch}
                                                onChange={(e) => setFormData({...formData, pitch: e.target.value})}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500"
                                            >
                                                <option>3/12</option>
                                                <option>4/12</option>
                                                <option>5/12</option>
                                                <option>6/12</option>
                                                <option>7/12</option>
                                                <option>8/12</option>
                                                <option>9/12</option>
                                                <option>10/12</option>
                                                <option>11/12</option>
                                                <option>12/12</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Layers</label>
                                            <select
                                                value={formData.layers}
                                                onChange={(e) => setFormData({...formData, layers: e.target.value})}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500"
                                            >
                                                <option value="1">1 Layer</option>
                                                <option value="2">2 Layers</option>
                                            </select>
                                        </div>
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-4 rounded-lg transition-colors"
                                    >
                                        Generate Quote
                                    </button>
                                </form>
                            </div>
                        </div>

                        <div>
                            <div className="bg-white rounded-xl shadow-lg p-6 sticky top-8">
                                <h3 className="text-lg font-bold text-gray-900 mb-4">Estimate Summary</h3>
                                <div className="space-y-3 mb-6">
                                    <div className="flex justify-between">
                                        <span className="text-gray-600">Roof Area</span>
                                        <span className="font-semibold">{formData.roofArea || 0} sq ft</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-gray-600">Material</span>
                                        <span className="font-semibold">{formData.material}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-gray-600">Pitch</span>
                                        <span className="font-semibold">{formData.pitch}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-gray-600">Layers</span>
                                        <span className="font-semibold">{formData.layers}</span>
                                    </div>
                                </div>
                                <div className="border-t pt-4">
                                    <div className="flex justify-between items-center">
                                        <span className="text-lg font-bold text-gray-900">Total Cost</span>
                                        <span className="text-2xl font-bold text-orange-600">
                                            ${calculateCost().toLocaleString()}
                                        </span>
                                    </div>
                                    <p className="text-xs text-gray-500 mt-2">
                                        Includes materials and labor
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Projects View
        function Projects({ projects, selectedProject, onSelectProject }) {
            const [filter, setFilter] = useState('all');

            const filteredProjects = projects.filter(p => 
                filter === 'all' || p.status === filter
            );

            return (
                <div>
                    <div className="flex items-center justify-between mb-8">
                        <h1 className="text-3xl font-bold text-gray-900">Projects</h1>
                        <button className="bg-orange-600 hover:bg-orange-700 text-white px-6 py-3 rounded-lg font-semibold transition">
                            + New Project
                        </button>
                    </div>

                    <div className="bg-white rounded-xl shadow-lg p-4 mb-6">
                        <select 
                            value={filter}
                            onChange={(e) => setFilter(e.target.value)}
                            className="px-4 py-2 border border-gray-300 rounded-lg"
                        >
                            <option value="all">All Projects</option>
                            <option value="quoted">Quoted</option>
                            <option value="in_progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>

                    <div className="bg-white rounded-xl shadow-lg overflow-hidden">
                        <table className="w-full">
                            <thead className="bg-gray-50 border-b">
                                <tr>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Customer</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Address</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Area</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Material</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Cost</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Status</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Actions</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-200">
                                {filteredProjects.map(project => (
                                    <tr key={project.id} className="hover:bg-gray-50">
                                        <td className="px-6 py-4">
                                            <p className="font-semibold text-gray-900">{project.customer}</p>
                                            <p className="text-sm text-gray-500">{project.phone}</p>
                                        </td>
                                        <td className="px-6 py-4 text-gray-900">{project.address}</td>
                                        <td className="px-6 py-4 text-gray-900">{project.roofArea} sq ft</td>
                                        <td className="px-6 py-4 text-gray-900">{project.material}</td>
                                        <td className="px-6 py-4">
                                            <span className="font-semibold text-orange-600">
                                                ${project.cost.toLocaleString()}
                                            </span>
                                        </td>
                                        <td className="px-6 py-4">
                                            <StatusBadge status={project.status} />
                                        </td>
                                        <td className="px-6 py-4">
                                            <button 
                                                onClick={() => onSelectProject(project)}
                                                className="text-orange-600 hover:text-orange-800 font-semibold text-sm"
                                            >
                                                View →
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // Project Modal
        function ProjectModal({ project, onClose }) {
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                        <div className="p-6">
                            <div className="flex items-center justify-between mb-6">
                                <div>
                                    <h2 className="text-2xl font-bold text-gray-900">{project.customer}</h2>
                                    <p className="text-gray-600">{project.address}</p>
                                </div>
                                <button onClick={onClose} className="text-gray-400 hover:text-gray-600 text-3xl">×</button>
                            </div>

                            <div className="grid grid-cols-2 gap-6 mb-6">
                                <div>
                                    <label className="text-sm text-gray-600">Email</label>
                                    <p className="font-medium">{project.email}</p>
                                </div>
                                <div>
                                    <label className="text-sm text-gray-600">Phone</label>
                                    <p className="font-medium">{project.phone}</p>
                                </div>
                                <div>
                                    <label className="text-sm text-gray-600">Roof Area</label>
                                    <p className="font-medium">{project.roofArea} sq ft</p>
                                </div>
                                <div>
                                    <label className="text-sm text-gray-600">Roof Pitch</label>
                                    <p className="font-medium">{project.pitch}</p>
                                </div>
                                <div>
                                    <label className="text-sm text-gray-600">Material</label>
                                    <p className="font-medium">{project.material}</p>
                                </div>
                                <div>
                                    <label className="text-sm text-gray-600">Status</label>
                                    <StatusBadge status={project.status} />
                                </div>
                            </div>

                            <div className="bg-orange-50 p-4 rounded-lg mb-6">
                                <div className="flex justify-between items-center">
                                    <span className="text-lg font-bold text-gray-900">Total Cost</span>
                                    <span className="text-2xl font-bold text-orange-600">
                                        ${project.cost.toLocaleString()}
                                    </span>
                                </div>
                            </div>

                            <div className="flex gap-3">
                                <button className="flex-1 bg-orange-600 hover:bg-orange-700 text-white px-4 py-3 rounded-lg font-semibold transition">
                                    📄 Generate PDF
                                </button>
                                <button className="flex-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-3 rounded-lg font-semibold transition">
                                    📧 Email Quote
                                </button>
                                <button onClick={onClose} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-3 rounded-lg font-semibold transition">
                                    Close
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Customers View
        function Customers({ customers }) {
            return (
                <div>
                    <h1 className="text-3xl font-bold text-gray-900 mb-8">Customers</h1>
                    
                    <div className="bg-white rounded-xl shadow-lg overflow-hidden">
                        <table className="w-full">
                            <thead className="bg-gray-50 border-b">
                                <tr>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Name</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Contact</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Address</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Projects</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Total Value</th>
                                    <th className="px-6 py-4 text-left text-sm font-semibold text-gray-700">Last Contact</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-200">
                                {customers.map(customer => (
                                    <tr key={customer.id} className="hover:bg-gray-50">
                                        <td className="px-6 py-4 font-semibold text-gray-900">{customer.name}</td>
                                        <td className="px-6 py-4">
                                            <p className="text-sm text-gray-900">{customer.email}</p>
                                            <p className="text-sm text-gray-600">{customer.phone}</p>
                                        </td>
                                        <td className="px-6 py-4 text-gray-900">{customer.address}</td>
                                        <td className="px-6 py-4">
                                            <span className="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-semibold">
                                                {customer.projects} projects
                                            </span>
                                        </td>
                                        <td className="px-6 py-4 font-semibold text-green-600">{customer.totalValue}</td>
                                        <td className="px-6 py-4 text-gray-600">{customer.lastContact}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // Reports View
        function Reports({ projects }) {
            const stats = {
                totalRevenue: projects.reduce((sum, p) => sum + p.cost, 0),
                avgProjectSize: projects.reduce((sum, p) => sum + p.cost, 0) / projects.length,
                completionRate: (projects.filter(p => p.status === 'completed').length / projects.length * 100).toFixed(1),
                totalSqFt: projects.reduce((sum, p) => sum + p.roofArea, 0)
            };

            return (
                <div>
                    <h1 className="text-3xl font-bold text-gray-900 mb-8">Reports & Analytics</h1>
                    
                    <div className="grid grid-cols-2 gap-6 mb-8">
                        <div className="bg-white rounded-xl shadow-lg p-6">
                            <h3 className="text-lg font-bold text-gray-900 mb-6">Revenue Metrics</h3>
                            <div className="space-y-4">
                                <MetricRow label="Total Revenue" value={`$${stats.totalRevenue.toLocaleString()}`} />
                                <MetricRow label="Avg Project Size" value={`$${Math.round(stats.avgProjectSize).toLocaleString()}`} />
                                <MetricRow label="Completion Rate" value={`${stats.completionRate}%`} />
                                <MetricRow label="Total Sq Ft" value={stats.totalSqFt.toLocaleString()} />
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-lg p-6">
                            <h3 className="text-lg font-bold text-gray-900 mb-6">Material Breakdown</h3>
                            <div className="space-y-3">
                                <div className="flex justify-between">
                                    <span className="text-gray-600">Architectural Shingles</span>
                                    <span className="font-semibold">45%</span>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-gray-600">Metal Roofing</span>
                                    <span className="font-semibold">25%</span>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-gray-600">Clay Tile</span>
                                    <span className="font-semibold">20%</span>
                                </div>
                                <div className="flex justify-between">
                                    <span className="text-gray-600">Other</span>
                                    <span className="font-semibold">10%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Settings View
        function Settings() {
            return (
                <div>
                    <h1 className="text-3xl font-bold text-gray-900 mb-8">Settings</h1>
                    <div className="bg-white rounded-xl shadow-lg p-6">
                        <div className="space-y-6">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Company Name</label>
                                <input type="text" defaultValue="ABC Roofing Co." className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Default Labor Rate ($/sq ft)</label>
                                <input type="number" defaultValue="3.50" className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Tax Rate (%)</label>
                                <input type="number" defaultValue="7.5" className="w-full px-4 py-3 border border-gray-300 rounded-lg" />
                            </div>
                            <button className="bg-orange-600 hover:bg-orange-700 text-white px-6 py-3 rounded-lg font-semibold transition">
                                Save Settings
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Helper Components
        function StatCard({ title, value, subtitle, color }) {
            const colors = {
                blue: 'from-blue-500 to-blue-600',
                orange: 'from-orange-500 to-orange-600',
                yellow: 'from-yellow-500 to-yellow-600',
                green: 'from-green-500 to-green-600'
            };

            return (
                <div className={`bg-gradient-to-br ${colors[color]} text-white rounded-xl shadow-lg p-6`}>
                    <p className="text-sm opacity-90 mb-2">{title}</p>
                    <p className="text-3xl font-bold mb-1">{value}</p>
                    <p className="text-sm opacity-75">{subtitle}</p>
                </div>
            );
        }

        function StatusBadge({ status }) {
            const styles = {
                'quoted': 'bg-yellow-100 text-yellow-800',
                'in_progress': 'bg-blue-100 text-blue-800',
                'completed': 'bg-green-100 text-green-800'
            };

            const labels = {
                'quoted': 'Quoted',
                'in_progress': 'In Progress',
                'completed': 'Completed'
            };

            return (
                <span className={`px-3 py-1 rounded-full text-xs font-semibold ${styles[status]}`}>
                    {labels[status]}
                </span>
            );
        }

        function MetricRow({ label, value }) {
            return (
                <div className="flex justify-between">
                    <span className="text-gray-600">{label}</span>
                    <span className="font-semibold text-gray-900">{value}</span>
                </div>
            );
        }

        // Render
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
